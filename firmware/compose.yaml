services:
  builder:
    build:
      context: .
      args:
        BUILDROOT_VERSION: ${BUILDROOT_VERSION:-2026.05.1}
    image: chronopolis-buildroot:${BUILDROOT_VERSION:-2026.05.1}

    # Buildroot refuses to build as root, and running as you keeps everything
    # under output/ owned by you rather than needing sudo to delete.
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"

    working_dir: /output

    environment:
      # That UID has no /etc/passwd entry, so HOME has to be somewhere real and
      # writable. ccache defaults to $HOME/.buildroot-ccache, which puts it on
      # the persistent volume below without hardcoding a path in the defconfig.
      HOME: /home/br
      # Downloaded tarballs, and the Cargo registry cache used when vendoring.
      BR2_DL_DIR: /dl

    volumes:
      # Read-only, with no writable holes: Buildroot's setlocalversion guards
      # `git update-index --refresh` behind `[ -w . ]`, so a writable subdirectory
      # makes that probe pass and the refresh then fails against a read-only
      # /src/.git. All or nothing.
      - ..:/src:ro
      - ./output:/output
      - ./.cache/dl:/dl
      - ./.cache/home:/home/br

    # No `init: true`: docker-init was the process that oopsed the Docker Desktop
    # VM kernel during a parallel build, and nothing here needs zombie reaping.
