services:
  builder:
    build:
      context: .
      args:
        BUILDROOT_VERSION: ${BUILDROOT_VERSION:-2026.05.1}
        # Baked in so the named volumes below inherit this ownership when Docker
        # first populates them from the image. Saves a chown step at run time.
        DOCKER_UID: ${DOCKER_UID:-1000}
        DOCKER_GID: ${DOCKER_GID:-1000}
    image: chronopolis-buildroot:${BUILDROOT_VERSION:-2026.05.1}

    # Buildroot refuses to build as root. UID/GID come from .env, which the
    # Makefile generates, so a bare `docker compose` here behaves identically.
    user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"

    working_dir: /output

    environment:
      HOME: /home/br
      BR2_DL_DIR: /dl

    volumes:
      # Source in, read-only. Buildroot rsyncs from it and must never write back
      # — and a writable subdirectory would make setlocalversion's `[ -w . ]`
      # probe pass and then fail against a read-only /src/.git.
      - ..:/src:ro

      # Finished artefacts out. Small and write-once, so a bind mount is fine.
      - ./artifacts:/artifacts

      # The build tree, downloads and ccache live in VM-native volumes rather
      # than bind mounts. This is not a preference — Docker Desktop's macOS file
      # sharing mishandles fchmod() on an open descriptor, leaving the file
      # permanently un-chmod-able (EPERM) even for its owner. e2fsprogs' `subst`
      # does exactly that (fchmod + rename), so a bind-mounted build tree cannot
      # get past host-e2fsprogs. Volumes are ext4 inside the VM and unaffected.
      - output:/output
      - dl:/dl
      - home:/home/br

    # No `init: true`: docker-init was the process that oopsed the Docker Desktop
    # VM kernel during a parallel build, and nothing here needs zombie reaping.

volumes:
  output:
    name: chronopolis-output
  dl:
    name: chronopolis-dl
  home:
    name: chronopolis-home
